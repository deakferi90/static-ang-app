<header class="header">
  <img class="header-image" src="combined-shape.png" alt="Homepage Image" />
</header>

<main class="jobs-container">
  <!-- Filter -->
  <div class="filter-bar">
    <div class="filter-tags">
      <div class="filter-tag">
        Frontend
        <button>×</button>
      </div>

      <div class="filter-tag">
        CSS
        <button>×</button>
      </div>

      <div class="filter-tag">
        JavaScript
        <button>×</button>
      </div>
    </div>

    <button class="clear-btn text-[#7c8f8f]">Clear</button>
  </div>

  <!-- Job Card -->
  <article class="job-card featured-card">
    <div class="job-info">
      <div class="company-logo photoshop"><span>▲</span> PHOTOSNAP</div>

      <div class="job-details">
        <div class="company-name">
          Photosnap
          <span class="badge new">NEW!</span>
          <span class="badge featured">FEATURED</span>
        </div>

        <h2>Senior Frontend Developer</h2>

        <div class="job-meta">
          <span>1d ago</span>
          <span>•</span>
          <span>Full Time</span>
          <span>•</span>
          <span>USA only</span>
        </div>
      </div>
    </div>

    <div class="job-tags">
      <span>Frontend</span>
      <span>Senior</span>
      <span>HTML</span>
      <span>CSS</span>
      <span>JavaScript</span>
    </div>
  </article>

  <!-- Job Card -->
  <article class="job-card">
    <div class="job-info">
      <div class="company-logo myhome">MYHOME</div>

      <div class="job-details">
        <div class="company-name">MyHome</div>

        <h2>Junior Frontend Developer</h2>

        <div class="job-meta">
          <span>5d ago</span>
          <span>•</span>
          <span>Contract</span>
          <span>•</span>
          <span>USA only</span>
        </div>
      </div>
    </div>

    <div class="job-tags">
      <span>Frontend</span>
      <span>Junior</span>
      <span>CSS</span>
      <span>JavaScript</span>
    </div>
  </article>
</main>
